<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>时间块 · 图标</title>
  <style>
    @font-face {
      font-family: "Noto Sans SC";
      src: url("../mockups/fonts/NotoSansSC-Variable.ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    html, body { margin: 0; background: #e4dcd4; }
    svg { display: block; }
    #png512 { width: 512px; height: 512px; }
    #sheet {
      width: 1400px; height: 720px;
      background: #e4dcd4;
      font-family: "Noto Sans SC", "WenQuanYi Micro Hei", sans-serif;
      color: #5a5f92;
      box-sizing: border-box;
      padding: 48px 56px;
    }
    h1 { font-size: 28px; letter-spacing: 0.08em; margin: 0 0 8px; }
    .sub { color: #7b80a0; font-size: 14px; margin-bottom: 36px; }
    .row { display: flex; gap: 40px; align-items: flex-end; }
    figure { margin: 0; text-align: center; }
    figcaption { margin-top: 12px; font-size: 13px; color: #7b80a0; letter-spacing: 0.06em; }
    .frame { width: 240px; height: 240px; }
    .shadow { box-shadow: 0 16px 40px rgba(90,95,146,0.16); }
  </style>
</head>
<body>
<svg id="defs" width="0" height="0">
  <defs>
    <g id="clock-art" transform="translate(512,512) scale(0.85) translate(-512,-512)" fill="none" stroke-linecap="butt">
      <path d="M512,182 A330,330 0 0 1 797.788,677" stroke="#808BD0" stroke-width="120"/>
      <path d="M797.788,677 A330,330 0 0 1 745.345,745.345" stroke="#E5AD8C" stroke-width="120"/>
      <path d="M745.345,745.345 A330,330 0 0 1 182,512" stroke="#8EBFD2" stroke-width="120"/>
      <path d="M182,512 A330,330 0 0 1 193.244,426.59" stroke="#E5AD8C" stroke-width="120"/>
      <path d="M193.244,426.59 A330,330 0 0 1 299.88,259.205" stroke="#E3C783" stroke-width="120"/>
      <path d="M299.88,259.205 A330,330 0 0 1 426.59,193.244" stroke="#DE8B9D" stroke-width="120"/>
      <path d="M426.59,193.244 A330,330 0 0 1 512,182" stroke="#9CCB97" stroke-width="120"/>
      <line x1="512" y1="512" x2="512" y2="362" stroke="#5A5F92" stroke-width="34" stroke-linecap="round"/>
      <line x1="512" y1="512" x2="617" y2="547" stroke="#5A5F92" stroke-width="34" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="32" fill="#5A5F92" stroke="none"/>
    </g>
    <g id="clock-mono" transform="translate(512,512) scale(0.85) translate(-512,-512)" fill="currentColor" stroke="currentColor" stroke-linecap="butt">
      <path d="M512,182 A330,330 0 0 1 797.788,677" fill="none" stroke-width="120"/>
      <path d="M797.788,677 A330,330 0 0 1 745.345,745.345" fill="none" stroke-width="120"/>
      <path d="M745.345,745.345 A330,330 0 0 1 182,512" fill="none" stroke-width="120"/>
      <path d="M182,512 A330,330 0 0 1 193.244,426.59" fill="none" stroke-width="120"/>
      <path d="M193.244,426.59 A330,330 0 0 1 299.88,259.205" fill="none" stroke-width="120"/>
      <path d="M299.88,259.205 A330,330 0 0 1 426.59,193.244" fill="none" stroke-width="120"/>
      <path d="M426.59,193.244 A330,330 0 0 1 512,182" fill="none" stroke-width="120"/>
      <line x1="512" y1="512" x2="512" y2="362" fill="none" stroke-width="34" stroke-linecap="round"/>
      <line x1="512" y1="512" x2="617" y2="547" fill="none" stroke-width="34" stroke-linecap="round"/>
      <circle cx="512" cy="512" r="32" stroke="none"/>
    </g>
  </defs>
</svg>

<svg id="png512" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" fill="#FBF5F1"/>
  <use href="#clock-art"/>
</svg>

<div id="sheet">
  <h1>时间块 · 启动图标</h1>
  <p class="sub">开环饼钟面 · 自适应图标 · 安全区 66% 内 · 512² PNG 已入库</p>
  <div class="row">
    <figure>
      <svg class="frame shadow" viewBox="0 0 1024 1024">
        <rect width="1024" height="1024" fill="#FBF5F1"/>
        <use href="#clock-art"/>
      </svg>
      <figcaption>方形 · Play / 512 PNG</figcaption>
    </figure>
    <figure>
      <svg class="frame shadow" viewBox="0 0 1024 1024">
        <defs>
          <clipPath id="circ"><circle cx="512" cy="512" r="512"/></clipPath>
        </defs>
        <g clip-path="url(#circ)">
          <rect width="1024" height="1024" fill="#FBF5F1"/>
          <use href="#clock-art"/>
        </g>
      </svg>
      <figcaption>圆形遮罩</figcaption>
    </figure>
    <figure>
      <svg class="frame shadow" viewBox="0 0 1024 1024">
        <defs>
          <clipPath id="squircle"><rect x="48" y="48" width="928" height="928" rx="220"/></clipPath>
        </defs>
        <g clip-path="url(#squircle)">
          <rect width="1024" height="1024" fill="#FBF5F1"/>
          <use href="#clock-art"/>
        </g>
      </svg>
      <figcaption>圆角方 · 常见 OEM</figcaption>
    </figure>
    <figure>
      <svg class="frame shadow" viewBox="0 0 1024 1024">
        <rect width="1024" height="1024" fill="#2C2E44"/>
        <g color="#FBF5F1"><use href="#clock-mono"/></g>
      </svg>
      <figcaption>单色层 · 主题图标</figcaption>
    </figure>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>时间块 · 界面稿</title>
  <style>
    @font-face {
      font-family: "Noto Sans SC";
      src: url("fonts/NotoSansSC-Variable.ttf") format("truetype");
      font-weight: 100 900;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Medium.ttf") format("truetype");
      font-weight: 500;
      font-display: swap;
    }
    @font-face {
      font-family: "Inter";
      src: url("fonts/Inter-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --paper: #fbf5f1;
      --paper-deep: #f3ebe5;
      --card: #fffcf9;
      --ink: #2b2e45;
      --ink-2: #5c5f75;
      --ink-3: #5e6178;
      --line: #e8e0d8;
      --line-2: #ddd4cc;
      --accent: #5a5f92;
      --wake: #d99a76;
      --wake-deep: #d99a76;
      --now: #5a5f92;
      --empty-past: #ede6e0;
      --empty-future: #f6f1ec;
      --sheet: #fffcf9;
      --work: #8ebfd2;
      --other: #a8a6a3;
      --eat: #e5ad8c;
      --sleep: #808bd0;
      --study: #a996cf;
      --read: #de8b9d;
      --play: #e3c783;
      --social: #9ccb97;
      --sport: #74b3ae;
      --write: #c4b5e3;
      --unfilled: #ede6e0;
      --sel: #5a5f92;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #e8e0d8; }
    body {
      font-family: "Noto Sans SC", "WenQuanYi Micro Hei", sans-serif;
      color: var(--ink);
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }
    .num { font-family: "Inter", "Noto Sans SC", sans-serif; font-feature-settings: "tnum" 1; }

    body.gallery {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% -10%, #fff8f3 0%, transparent 50%),
        #e8e0d8;
      padding: 48px 40px 80px;
    }

    .gallery-head { max-width: 1480px; margin: 0 auto 36px; }
    .gallery-head h1 {
      font-size: 32px; font-weight: 620; letter-spacing: 0.04em;
    }
    .gallery-head p {
      margin-top: 8px; color: var(--ink-2); font-size: 15px; line-height: 1.6;
    }
    .gallery-grid {
      display: flex; flex-wrap: wrap; gap: 36px 28px;
      max-width: 1480px; margin: 0 auto;
    }
    .frame { width: 390px; }
    .frame figcaption {
      margin-top: 14px; text-align: center;
      font-size: 13px; color: var(--ink-2); letter-spacing: 0.06em;
    }
    .frame figcaption strong { color: var(--ink); font-weight: 560; }

    .phone {
      width: 390px; height: 844px;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      background: var(--paper);
      box-shadow:
        0 0 0 10px #3d4166,
        0 0 0 12px #2a2d4a,
        0 24px 50px rgba(90, 95, 146, 0.22);
    }
    body.shot .phone {
      border-radius: 0;
      box-shadow: none;
    }
    body.shot, body.shot html { background: #000; }
    body.shot { padding: 0; }
    body.shot .gallery-head,
    body.shot .gallery-grid,
    body.shot figcaption { display: none !important; }
    body.shot .frame { margin: 0; }
    body.shot .phone { display: none; }
    body.shot .phone.target { display: block; }

    body.overview-page {
      background: #e4dcd4;
      padding: 56px 48px 64px;
      min-width: 2680px;
    }
    .overview-wrap { width: 2584px; }
    .overview-wrap h1 {
      font-size: 36px; font-weight: 620; letter-spacing: 0.10em; margin-bottom: 8px;
    }
    .overview-wrap .sub {
      color: var(--ink-2); font-size: 16px; margin-bottom: 40px;
    }
    .overview-row {
      display: flex; gap: 32px; align-items: flex-start;
    }

    .screen {
      width: 390px; height: 844px;
      display: flex; flex-direction: column;
      background: var(--paper);
      position: relative;
    }

    .sb {
      height: 36px; padding: 0 22px 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 600; flex: none;
    }
    .sb-right { display: flex; align-items: center; gap: 6px; }
    .sb-right svg { display: block; }

    .tabs {
      height: 64px; flex: none;
      display: flex; padding: 0 12px 10px;
      border-top: 1px solid var(--line);
      background: #faf6ee;
    }
    .tab {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      color: var(--ink-3); font-size: 11px; letter-spacing: 0.04em;
      font-weight: 500;
    }
    .tab.on { color: var(--ink); font-weight: 600; }
    .tab svg { display: block; }

    .gesture {
      position: absolute; left: 50%; bottom: 7px;
      width: 118px; height: 4px; margin-left: -59px;
      background: #2c2824; border-radius: 4px; opacity: 0.28;
    }

    .badge-ex {
      display: inline-flex; align-items: center;
      height: 20px; padding: 0 8px;
      border-radius: 999px;
      background: #e8d4c0; color: #7a5340;
      font-size: 11px; letter-spacing: 0.04em;
    }

    /* ===== 1 起床前 ===== */
    .wake {
      flex: 1; display: flex; flex-direction: column;
      padding: 8px 24px 0;
      background:
        radial-gradient(ellipse 90% 55% at 50% 18%, #f7d7c2 0%, transparent 62%),
        radial-gradient(ellipse 70% 40% at 80% 90%, #e7ddd0 0%, transparent 60%),
        var(--paper);
    }
    .wake-top {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .brand { font-size: 15px; font-weight: 620; letter-spacing: 0.18em; }
    .wake-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 24px; }
    .wake-date { font-size: 15px; color: var(--ink-2); letter-spacing: 0.08em; }
    .wake-title { margin-top: 10px; font-size: 30px; font-weight: 620; letter-spacing: 0.04em; }
    .wake.asleep {
      background:
        radial-gradient(ellipse 90% 50% at 50% 16%, #dfe1ee 0%, transparent 64%),
        radial-gradient(ellipse 70% 40% at 80% 90%, #f3e4d8 0%, transparent 60%),
        var(--paper);
    }
    .sleep-btn {
      font-size: 12px; color: #fff; background: var(--accent);
      padding: 6px 12px; border-radius: 999px; letter-spacing: 0.06em;
    }
    .toast {
      margin: 0 16px 10px;
      background: var(--accent); color: #fff;
      border-radius: 12px; padding: 10px 14px;
      font-size: 13px; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 20px rgba(44,40,36,0.12);
    }
    .toast i {
      width: 8px; height: 8px; border-radius: 50%;
      background: #8b93a8; flex: none;
    }

    .wake-btn-wrap { margin-top: 36px; position: relative; }
    .halo {
      position: absolute; inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(229,173,140,0.28), transparent 68%);
    }
    .wake-btn {
      position: relative;
      width: 188px; height: 188px; border-radius: 50%;
      background: linear-gradient(180deg, #e5ad8c 0%, #d99a76 70%, #d08e6a 100%);
      color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow:
        0 16px 32px rgba(217, 154, 118, 0.32),
        inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .wake-btn .lbl { font-size: 28px; font-weight: 620; letter-spacing: 0.12em; }
    .wake-btn .sub { margin-top: 6px; font-size: 12px; opacity: 0.82; letter-spacing: 0.08em; }

    .ghost-grid {
      display: grid; grid-template-columns: repeat(8, 10px); gap: 5px;
      margin-top: 40px; opacity: 0.45;
    }
    .ghost-grid i {
      width: 10px; height: 10px; border-radius: 3px; background: #ede6e0;
    }
    .ghost-grid i:nth-child(3n) { background: #e5ad8c; }

    .wake-foot {
      text-align: center; color: var(--ink-3); font-size: 12px;
      padding-bottom: 8px; letter-spacing: 0.04em;
    }

    /* ===== 2/3 今日格 ===== */
    .today { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .today-head { padding: 6px 20px 10px; }
    .today-head .row {
      display: flex; align-items: center; justify-content: space-between;
    }
    .today-head h1 { font-size: 22px; font-weight: 620; letter-spacing: 0.02em; }
    .edit {
      font-size: 12px; color: var(--wake-deep); padding: 4px 8px;
      border-radius: 999px; background: #e8e9f4;
    }
    .meta { margin-top: 6px; font-size: 12px; color: var(--ink-2); display: flex; gap: 12px; }
    .meta b { color: var(--ink); font-weight: 560; }

    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      padding: 0 16px 12px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 8px 9px;
      text-align: center;
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 6px 14px rgba(80,60,40,0.04);
    }
    .stat .n { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
    .stat .l { margin-top: 4px; font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; font-weight: 500; }
    .stat.em { background: #e8e9f4; border-color: #d4d6e8; }
    .stat.em .n { color: var(--accent); }

    .grid-wrap {
      padding: 0 14px 0 10px;
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .grid-fade-top, .grid-fade-bot {
      position: absolute; left: 0; right: 0; height: 12px; z-index: 3; pointer-events: none;
    }
    .grid-fade-top { top: 0; background: linear-gradient(var(--paper), transparent); }
    .grid-fade-bot { bottom: 0; background: linear-gradient(transparent, var(--paper)); }

    .hour {
      display: grid;
      grid-template-columns: 42px 1fr;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      position: relative;
      flex: 1;
      min-height: 0;
    }
    .hour-t {
      font-size: 11px; color: var(--ink-3); text-align: right; padding-right: 2px;
      font-family: "Inter", "Noto Sans SC", sans-serif;
      font-weight: 500;
    }
    .cells { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; height: 100%; }
    .c {
      height: 100%; min-height: 28px; border-radius: 8px;
      background: var(--empty-past);
      position: relative;
    }
    .c.f { background: var(--empty-future); box-shadow: inset 0 0 0 1px var(--line); }
    .c.work { background: var(--work); }
    .c.eat { background: var(--eat); }
    .c.sleep { background: var(--sleep); }
    .c.study { background: var(--study); }
    .c.read { background: var(--read); }
    .c.play { background: var(--play); }
    .c.social { background: var(--social); }
    .c.sport { background: var(--sport); }
    .c.plan { opacity: 0.48; }

    .now-line {
      position: absolute; left: 42px; right: 0; top: 50%;
      height: 0; z-index: 4; pointer-events: none;
    }
    .now-line::before {
      content: "";
      position: absolute; left: 0; right: 0; top: 0;
      border-top: 2px solid var(--now);
    }
    .now-line span {
      position: absolute; right: 0; top: -9px;
      background: var(--now); color: #fff8f3;
      font-size: 10px; padding: 1px 6px; border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .now-line i {
      position: absolute; left: -5px; top: -4px;
      width: 8px; height: 8px; border-radius: 50%; background: var(--now);
    }

    .c.sel {
      outline: 2px solid var(--ink);
      outline-offset: 1px;
      box-shadow: 0 0 0 4px rgba(44,40,36,0.10);
      z-index: 2;
    }
    .screen[data-shot="03-picker"] .today { flex: none; }
    .screen[data-shot="03-picker"] .grid-wrap { flex: none; }
    .screen[data-shot="03-picker"] .hour { flex: none; height: 42px; }
    .screen[data-shot="03-picker"] .c { height: 36px; min-height: 0; }
    .sel-chip {
      position: absolute; left: 50px; top: -13px;
      background: var(--ink); color: #f7f1e8;
      font-size: 10px; padding: 2px 7px; border-radius: 999px;
      z-index: 5;
    }

    .legend {
      display: flex; flex-wrap: wrap; gap: 8px 10px;
      padding: 8px 20px 6px;
      font-size: 11px; color: var(--ink-2);
    }
    .legend b { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 1px; }

    /* ===== sheet ===== */
    .dim {
      position: absolute; inset: 0;
      background: rgba(44, 40, 36, 0.34);
      z-index: 6;
    }
    .sheet {
      position: absolute; left: 0; right: 0; bottom: 0;
      background: var(--sheet);
      border-radius: 22px 22px 0 0;
      padding: 10px 18px 28px;
      z-index: 7;
      box-shadow: 0 -12px 40px rgba(44,40,36,0.16);
    }
    .sheet-handle {
      width: 40px; height: 4px; border-radius: 4px;
      background: #ddd4c6; margin: 2px auto 12px;
    }
    .sheet h2 { font-size: 16px; font-weight: 620; }
    .sheet .hint { margin-top: 4px; font-size: 12px; color: var(--ink-2); }

    .types {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
      margin-top: 14px;
    }
    .type.add { grid-column: 1 / -1; justify-content: center; }
    .type {
      display: flex; align-items: center; gap: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
    }
    .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
    .type.add {
      border-style: dashed; color: var(--ink-2); background: transparent;
    }
    .type.add .plus {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.2px solid var(--ink-3);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; line-height: 1;
    }
    .sheet-actions { display: flex; gap: 8px; margin-top: 12px; }
    .ghost-btn, .pri-btn {
      flex: 1; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .ghost-btn { background: var(--paper-deep); color: var(--ink-2); }
    .pri-btn { background: var(--ink); color: #f7f1e8; }

    /* ===== 统计 ===== */
    .stats-page { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 4px 16px 0; }
    .stats-page h1 { font-size: 22px; font-weight: 620; }
    .seg {
      margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr);
      background: #e8e0d4; border-radius: 12px; padding: 3px;
    }
    .seg i {
      text-align: center; font-style: normal;
      font-size: 13px; padding: 7px 0; border-radius: 10px; color: var(--ink-2);
      font-weight: 500;
    }
    .seg i.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(44,40,36,0.06); }

    .period {
      display: flex; align-items: center; justify-content: space-between;
      margin: 12px 2px 8px; font-size: 14px;
    }
    .chev {
      width: 28px; height: 28px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--line);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink-2);
    }

    .sum3 {
      display: flex; gap: 0; justify-content: space-between;
      padding: 8px 4px 4px; font-size: 12px; color: var(--ink-2);
      font-weight: 500;
    }
    .sum3 b { display: block; font-size: 16px; color: var(--ink); font-weight: 650; margin-bottom: 2px; }

    .pie-wrap {
      display: flex; justify-content: center; padding: 6px 0 8px;
    }
    .pie {
      width: 148px; height: 148px; border-radius: 50%;
      background: conic-gradient(
        var(--sleep) 0 47.9%,
        var(--work) 47.9% 70.8%,
        var(--study) 70.8% 83.3%,
        var(--eat) 83.3% 89.6%,
        var(--read) 89.6% 93.8%,
        var(--social) 93.8% 98.0%,
        var(--sport) 98.0% 100%
      );
      position: relative;
      box-shadow: 0 8px 20px rgba(80,60,40,0.08);
    }
    .pie::after {
      content: "";
      position: absolute; inset: 36px;
      background: var(--paper);
      border-radius: 50%;
    }
    .pie-label {
      position: absolute; inset: 36px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 1;
    }
    .pie-label .n { font-size: 22px; font-weight: 700; letter-spacing: -0.03em; line-height: 1; }
    .pie-label .l { font-size: 10px; color: var(--ink-3); margin-top: 3px; font-weight: 500; }

    .tlist { margin-top: 6px; }
    .trow {
      display: grid;
      grid-template-columns: 12px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      height: 36px;
      font-size: 13px;
      border-bottom: 1px solid #e8dccb;
    }
    .trow:last-child { border-bottom: 0; }
    .trow .dot { width: 10px; height: 10px; }
    .trow .name { font-weight: 600; }
    .trow .fig {
      font-size: 12px; color: var(--ink-2); white-space: nowrap;
      font-family: "Inter", "Noto Sans SC", sans-serif;
    }

    /* ===== 设置 ===== */
    .set-page { flex: 1; padding: 4px 16px 0; }
    .set-page h1 { font-size: 22px; font-weight: 620; margin-bottom: 14px; }
    .group {
      background: var(--card);
      border: 1px solid #d8ccb8;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
      box-shadow: 0 6px 16px rgba(80,60,40,0.04);
    }
    .group .cap {
      padding: 10px 14px 0; font-size: 11px; color: var(--ink-3); letter-spacing: 0.08em;
      font-weight: 500;
    }
    .srow {
      display: flex; align-items: center; gap: 12px;
      padding: 13px 14px;
      border-top: 1px solid #f0e8db;
    }
    .group .srow:first-of-type { border-top: 0; }
    .sico {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex: none;
    }
    .srow .txt { flex: 1; min-width: 0; }
    .srow .ttl { font-size: 14px; font-weight: 500; }
    .srow .sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; font-weight: 500; }
    .srow .val { font-size: 13px; color: var(--ink-2); }
    .srow .chev { border: 0; background: transparent; width: 16px; height: 16px; }

    .dots { display: flex; gap: 4px; }
    .dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }

    .fineprint { text-align: center; font-size: 11px; color: var(--ink-3); line-height: 1.7; padding: 6px 12px 0; font-weight: 500; }

    /* ===== 类型管理 ===== */
    .type-page { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .type-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px 8px;
    }
    .type-nav .back { font-size: 14px; color: var(--ink-2); }
    .type-nav h1 { font-size: 17px; font-weight: 620; }
    .type-nav .done { font-size: 14px; color: var(--wake-deep); }

    .tmanage { padding: 0 16px; }
    .mrow {
      display: flex; align-items: center; gap: 10px;
      background: var(--card);
      border: 1px solid #d8ccb8;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .mrow .dot { width: 16px; height: 16px; }
    .mrow .name { flex: 1; font-size: 14px; }
    .tag {
      font-size: 10px; color: var(--ink-3);
      background: var(--paper-deep); padding: 2px 6px; border-radius: 6px;
    }
    .grip { color: var(--line-2); letter-spacing: -1px; font-size: 14px; }

    .colors {
      display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px;
      margin-top: 12px;
    }
    .sw {
      aspect-ratio: 1; border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(44,40,36,0.08);
      position: relative;
    }
    .sw.on::after {
      content: "";
      position: absolute; inset: 3px;
      border: 2px solid #fffdf9; border-radius: 50%;
    }
    .field {
      margin-top: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .field label { display: block; font-size: 11px; color: var(--ink-3); }
    .field .input { margin-top: 4px; font-size: 16px; font-weight: 560; }

    .preview-chip {
      margin-top: 12px;
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--paper); border: 1px solid var(--line);
      border-radius: 999px; padding: 6px 12px; font-size: 13px;
    }
  </style>
</head>
<body class="gallery">
  <header class="gallery-head">
    <h1>时间块</h1>
    <p>界面稿 · 390 × 844 · 示例数据（2026年10月21日，周三）· 日历日 144 块 · 00:42 入睡 · 07:12 醒来</p>

<script>
  function stamp(root, tab) {
    const slotSt = root.querySelector("[data-status]");
    const clock = slotSt && slotSt.getAttribute("data-status");
    const st = document.getElementById("tpl-status").content.cloneNode(true);
    if (clock) st.querySelector("[data-clock]").textContent = clock;
    slotSt.replaceWith(st);
    const slot = root.querySelector("[data-tabs]");
    if (!slot) return;
    const tabs = document.getElementById("tpl-tabs").content.cloneNode(true);
    const key = slot.getAttribute("data-tabs");
    tabs.querySelector(".TODAY").classList.toggle("on", key === "today");
    tabs.querySelector(".STATS").classList.toggle("on", key === "stats");
    tabs.querySelector(".SET").classList.toggle("on", key === "set");
    slot.replaceWith(tabs);
  }

  function mount(id, tplId) {
    const host = document.getElementById(id);
    const node = document.getElementById(tplId).content.cloneNode(true);
    stamp(node);
    host.appendChild(node);
  }

  mount("p1", "tpl-s1");
  mount("p2", "tpl-s2");
  mount("p3", "tpl-s3");
  mount("p4", "tpl-s4");
  mount("p5", "tpl-s5");
  mount("p6", "tpl-s6");

  const params = new URLSearchParams(location.search);
  const shot = params.get("shot");
  if (shot) {
    document.body.className = "shot";
    const map = { "1": "p1", "2": "p2", "3": "p3", "4": "p4", "5": "p5", "6": "p6" };
    const phone = document.getElementById(map[shot]);
    phone.classList.add("target");
    document.body.appendChild(phone);
  }

  if (params.get("overview") === "1") {
    document.body.className = "overview-page";
    const board = document.getElementById("overview-board");
    const row = document.getElementById("overview-row");
    ["f1","f2","f3","f4","f5","f6"].forEach((id) => row.appendChild(document.getElementById(id)));
    board.style.display = "block";
    document.querySelector(".gallery-head").style.display = "none";
    document.querySelector(".gallery-grid").style.display = "none";
  }
